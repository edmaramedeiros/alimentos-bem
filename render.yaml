# Blueprint do Render para os serviços deste projeto.
# Banco de dados (Postgres) é provisionado à parte no Neon (não no Render).
# Preencha os valores de env marcados como sync: false diretamente no
# dashboard do Render (não versione segredos aqui).

services:
  - type: web
    name: edmara-backend
    runtime: docker
    dockerContext: apps/backend
    dockerfilePath: apps/backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: WHATSAPP_SERVICE_URL
        sync: false
      - key: WHATSAPP_SERVICE_API_KEY
        sync: false

  - type: web
    name: edmara-whatsapp-service
    runtime: docker
    dockerContext: apps/whatsapp-service
    dockerfilePath: apps/whatsapp-service/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: warn
