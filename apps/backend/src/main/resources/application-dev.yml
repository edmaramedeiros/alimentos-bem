spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/edmara_alimentos}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    com.edmara.alimentos: DEBUG

app:
  seed-admin:
    enabled: true
